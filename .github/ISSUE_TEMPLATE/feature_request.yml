name: Feature request
description: Suggest an improvement or a new integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What production problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: What would you like to write? A code sketch helps a lot.
      render: python
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
