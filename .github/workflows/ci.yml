name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --python 3.12
      - run: uv run ruff check src tests scripts examples benchmarks
      - run: uv run ruff format --check src tests scripts examples benchmarks
      - run: uv run mypy
      - name: Benchmarks and offline demo still run
        run: |
          uv run python benchmarks/run.py --quick
          CALLM_HOME="$RUNNER_TEMP/callm-demo" uv run python examples/offline_demo.py

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --python ${{ matrix.python }}
      - name: Run tests
        if: "!(matrix.os == 'ubuntu-latest' && matrix.python == '3.12')"
        run: uv run pytest
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: uv run pytest --cov=callm --cov-report=term --cov-fail-under=90
      - name: Coverage summary
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  minimal-install:
    name: Install without extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv build
      - name: Import and use callm with zero dependencies
        run: |
          uv venv --python 3.12 /tmp/bare
          uv pip install --python /tmp/bare/bin/python dist/*.whl
          /tmp/bare/bin/python - <<'PY'
          import sys
          import callm
          assert not [m for m in ("openai", "anthropic", "pydantic", "httpx") if m in sys.modules]
          assert callm.redact_pii("mail a@b.io") == "mail [EMAIL_1]"
          assert callm.get_price("anthropic", "claude-sonnet-5") is not None
          try:
              callm.complete("gpt-4o-mini", "hi")
          except callm.MissingDependencyError as exc:
              assert "callm-toolkit[openai]" in str(exc)
          else:
              raise SystemExit("expected MissingDependencyError")
          print("ok", callm.__version__)
          PY
          /tmp/bare/bin/callm --version

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv run --only-group docs mkdocs build --strict
