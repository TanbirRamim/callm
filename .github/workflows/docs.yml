name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "README.md", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
      - run: git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: uv run --only-group docs mkdocs gh-deploy --force --strict
