[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "callm"
dynamic = ["version"]
description = "The production toolkit for LLM calls: caching, retries, fallback, cost tracking, security and structured output in one decorator."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Tanbir Hossain Ramim" }]
keywords = ["llm", "openai", "anthropic", "gemini", "caching", "retry", "fallback", "pii", "prompt-injection", "pydantic", "production"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
# The base package has zero dependencies. Everything else is an optional extra.
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
google = ["google-genai>=1.0"]
validation = ["pydantic>=2.6"]
cache = ["sentence-transformers>=2.7"]
security = ["spacy>=3.7"]
redis = ["redis>=5.0"]
otel = ["opentelemetry-api>=1.20"]
tokens = ["tiktoken>=0.7"]
cli = ["rich>=13.0"]
all = [
  "callm[openai,anthropic,google,validation,cache,security,redis,otel,tokens,cli]",
]

[project.scripts]
callm = "callm.cli:main"

[project.urls]
Homepage = "https://github.com/TanbirRamim/callm"
Documentation = "https://tanbirramim.github.io/callm"
Repository = "https://github.com/TanbirRamim/callm"
Issues = "https://github.com/TanbirRamim/callm/issues"
Changelog = "https://github.com/TanbirRamim/callm/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6",
  "pre-commit>=3.7",
  "pydantic>=2.6",
  "openai>=1.40",
  "anthropic>=0.40",
  "google-genai>=1.0",
  "rich>=13.0",
  "fakeredis>=2.23",
  "redis>=5.0",
  "opentelemetry-api>=1.20",
  "opentelemetry-sdk>=1.20",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
]

[tool.hatch.version]
path = "src/callm/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/callm"]

[tool.hatch.build.targets.sdist]
include = ["src/callm", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["callm"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "\\.\\.\\.$",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "RET", "TID"]
ignore = ["E501", "RET504", "SIM105", "RUF012", "PT011"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "RUF001", "PT018", "RUF059"]
"src/callm/security/injection.py" = ["RUF001"]

[tool.mypy]
python_version = "3.10"
files = ["src/callm"]
strict = true
warn_unreachable = false
disallow_any_generics = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["callm.providers.*", "callm.storage.redis", "callm.embeddings", "callm.middleware.telemetry"]
disallow_untyped_calls = false
warn_return_any = false
