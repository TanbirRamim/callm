site_name: callm
site_description: The production toolkit for LLM calls — caching, retries, fallback, cost tracking, security and structured output in one decorator.
site_url: https://tanbirramim.github.io/callm/
repo_url: https://github.com/TanbirRamim/callm
repo_name: TanbirRamim/callm
edit_uri: edit/main/docs/
copyright: MIT License

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - How it works: how-it-works.md
  - Guides:
      - Retries: guides/retries.md
      - Caching: guides/caching.md
      - Provider fallback: guides/fallback.md
      - Cost tracking & budgets: guides/cost.md
      - Input security: guides/security.md
      - Structured output: guides/validation.md
      - Telemetry & CLI: guides/telemetry.md
      - shield & complete: guides/direct-api.md
      - Configuration: guides/configuration.md
  - Cookbook:
      - Overview: cookbook/index.md
      - Support chatbot: cookbook/chatbot.md
      - RAG with citations: cookbook/rag.md
      - Data extraction: cookbook/data-extraction.md
  - Benchmarks: benchmarks.md
  - API reference: api-reference.md
  - FAQ & limitations: faq.md
